name: interp-probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r interp-probe/requirements.txt
      - name: Run experiment on GPT-2 small
        working-directory: interp-probe
        run: python run_probe.py --model gpt2
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interp-probe/results
          git diff --cached --quiet || git commit -m "interp-probe: update GPT-2 results"
          git push
